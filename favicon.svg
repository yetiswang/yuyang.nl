<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: rgba(235,230,220,0.93); }
      .bg { fill: #1c1a18; }
      circle { stroke: rgba(235,230,220,0.6); }
    }
    text {
      fill: rgba(0,0,0,0.92);
      font-family: 'Songti SC', 'STSong', 'Noto Serif CJK SC', 'SimSun', 'Source Serif 4', Georgia, serif;
