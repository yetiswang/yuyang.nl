    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                var theme = (saved === 'dark' || saved === 'light')
                    ? saved
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();

    <script>
        (function() {
            var btn = document.getElementById('theme-toggle');
            var html = document.documentElement;
            var sysDark = window.matchMedia('(prefers-color-scheme: dark)');

            function updateLabel() {
                var t = html.getAttribute('data-theme');
                btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            }
            function syncBodyTheme(theme) {
                document.body.setAttribute('data-theme', theme || html.getAttribute('data-theme'));
            }

            html.classList.remove('preload');
            syncBodyTheme();
            updateLabel();

            btn.addEventListener('click', function() {
                var cur = html.getAttribute('data-theme');
                var next = cur === 'dark' ? 'light' : 'dark';
                html.classList.add('preload');
                html.setAttribute('data-theme', next);
                syncBodyTheme(next);
                try { localStorage.setItem('theme', next); } catch(e) {}
                updateLabel();
                void html.offsetWidth;
                requestAnimationFrame(function() {
                    html.classList.remove('preload');
                });
            });

            sysDark.addEventListener('change', function(e) {
                try {
                    if (!localStorage.getItem('theme')) {
                        html.classList.add('preload');
                        var nextSys = e.matches ? 'dark' : 'light';
                        html.setAttribute('data-theme', nextSys);
                        syncBodyTheme(nextSys);
                        updateLabel();
                        void html.offsetWidth;
                        requestAnimationFrame(function() {
                            html.classList.remove('preload');
                        });
                    }
                } catch(err) {}
            });
        })();

            (function(){
                var h = document.querySelector('.nav-hamburger');
                var l = document.querySelector('nav .links');
                if (h && l) {
                    h.addEventListener('click', function(){
                        h.classList.toggle('open');
                        l.classList.toggle('open');
                    });
                    document.addEventListener('click', function(e){
                        if (!h.contains(e.target) && !l.contains(e.target)) {
                            h.classList.remove('open');
                            l.classList.remove('open');
                        }
                    });
                }
            })();
</script>
