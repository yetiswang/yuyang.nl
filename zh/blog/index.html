    <link rel="stylesheet" href="/shared.css">    <style>
        :root { --body-font: 'Noto Serif TC', 'Songti SC', 'SimSun', serif; --heading-font: 'Noto Serif TC', 'Songti SC', 'SimSun', serif; }
    <style>
        .page-heading {
            padding: 64px 0 8px;
        }
        .page-heading h1 {
            font-family: 'Noto Serif TC', 'Songti SC', 'SimSun', serif;
            font-size: 40px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.3px;
            margin-bottom: 12px;
        }
        .page-heading p {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
        }
        .posts { padding: 40px 0 64px; }
        .posts .empty {
            padding: 48px 0;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 400;
        }
        .post-item {
            padding: 24px 0;
            border-bottom: 1px solid var(--border);
        }
        .post-item:first-child { border-top: 1px solid var(--border); }
        .post-item .date {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .post-item h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .post-item h2 a {
            color: var(--text);
        }
        .post-item h2 a:hover { color: var(--link); border-bottom: none; }
        .post-item p {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.50;
        }
        .post-item .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .post-item .tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: var(--tag-text);
            background: var(--tag-bg);
            padding: 4px 8px;
            border-radius: 9999px;
            letter-spacing: 0.125px;
        }
        @media (max-width: 600px) {
            .page-heading h1 { font-size: 32px; letter-spacing: -0.8px; }
            nav .links { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/zh/" class="logo">王昱揚</a>
            <div class="links">
                <a href="/zh/">首頁</a>
                <a href="/zh/blog/" class="active">網誌</a>
                <a href="/blog/" class="lang">EN</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="toggle-track">
                        <span class="toggle-indicator"></span>
                    </span>
                </button>
            </div>
        </nav>

        <div class="page-heading">
            <h1>網誌</h1>
            <p>關於管理科學、AI 範式轉移、研究基礎設施，以及創造發現條件的文章與觀察。</p>
        </div>

        <div class="posts">
            <div class="post-item">
                <div class="date">2026 年 5 月 26 日</div>
                <h2><a href="/zh/blog/what-does-it-mean-to-manage-science/">管理科學意味著什麼？</a></h2>
                <p>科學管理不是行政工作。不是追趕經費申請。而是創造那些原本不可能出現的發現條件。</p>
                <div class="tags">
                    <span class="tag">管理科學</span>
                    <span class="tag">基礎設施</span>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 王昱揚 &middot; <a href="/zh/">yuyang.nl</a></p>
        </footer>
    </div>
    <script>
        (function() {
            var btn = document.getElementById('theme-toggle');
            var html = document.documentElement;
            function getPreferred() {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            function applyTheme(theme) {
                if (theme === 'auto') {
                    html.removeAttribute('data-theme');
                    var sys = getPreferred();
                    html.setAttribute('data-theme', sys);
                } else {
                    html.setAttribute('data-theme', theme);
                }
                btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : theme === 'light' ? 'Switch to dark mode' : 'Switch theme');
            }
            html.classList.remove('preload');
            var saved = localStorage.getItem('theme');
            if (saved) { applyTheme(saved); }
            else { applyTheme('auto'); }
            btn.addEventListener('click', function() {
                var current = localStorage.getItem('theme') || 'auto';
                var next = current === 'auto' ? 'dark' : current === 'dark' ? 'light' : 'auto';
                if (next === 'auto') localStorage.removeItem('theme');
                else localStorage.setItem('theme', next);
                applyTheme(next);
            });
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme') || localStorage.getItem('theme') === 'auto') {
                    applyTheme('auto');
                }
            });
        })();
    </script>
</body>
</html>
