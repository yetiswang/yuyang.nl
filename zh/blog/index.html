<!DOCTYPE html>
<html lang="zh-Hant" class="preload">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網誌 — 王昱揚</title>
    <meta name="description" content="王昱揚的網誌文章 — 研究基礎設施、科學人工智慧、策略">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text: rgba(0,0,0,0.92);
            --text-secondary: #5a544c;
            --text-muted: #9a948d;
            --bg: #fcfcfa;
            --bg-alt: #f2f0ed;
            --border: rgba(0,0,0,0.08);
            --btn-bg: rgba(0,0,0,0.04);
            --btn-hover: rgba(0,0,0,0.08);
            --tag-bg: #eef4fc;
            --tag-text: #0a6fc0;
            --link: #0066c8;
            --link-hover: #004d99;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme='light']) {
                --text: rgba(235,230,220,0.93);
                --text-secondary: #a89888;
                --text-muted: #7a7068;
                --bg: #1c1a18;
                --bg-alt: #262422;
                --border: rgba(255,255,255,0.07);
                --btn-bg: rgba(255,255,255,0.06);
                --btn-hover: rgba(255,255,255,0.10);
                --tag-bg: #1a2635;
                --tag-text: #7ab8ff;
                --link: #5ba0e0;
                --link-hover: #7ab8ff;
            }
        }
        [data-theme='dark'] {
            --text: rgba(235,230,220,0.93);
            --text-secondary: #a89888;
            --text-muted: #7a7068;
            --bg: #1c1a18;
            --bg-alt: #262422;
            --border: rgba(255,255,255,0.07);
            --btn-bg: rgba(255,255,255,0.06);
            --btn-hover: rgba(255,255,255,0.10);
            --tag-bg: #1a2635;
            --tag-text: #7ab8ff;
            --link: #5ba0e0;
            --link-hover: #7ab8ff;
        }
        [data-theme='light'] {
            --text: rgba(0,0,0,0.92);
            --text-secondary: #5a544c;
            --text-muted: #9a948d;
            --bg: #fcfcfa;
            --bg-alt: #f2f0ed;
            --border: rgba(0,0,0,0.08);
            --btn-bg: rgba(0,0,0,0.04);
            --btn-hover: rgba(0,0,0,0.08);
            --tag-bg: #eef4fc;
            --tag-text: #0a6fc0;
            --link: #0066c8;
            --link-hover: #004d99;
        }
        html.preload, html.preload * { transition: none !important; }
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
        html { font-size: 16px; -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Inter', 'Noto Serif TC', 'Songti SC', 'SimSun', serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 0 24px; }
        a { color: var(--link); text-decoration: none; }
        a:hover { border-bottom: 1px solid var(--link); }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        nav .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
        }
        nav .logo:hover { border-bottom: none; color: var(--link); }
        nav .links { display: flex; gap: 24px; }
        nav .links a {
            font-size: 15px;
            font-weight: 500;
color: var(--text);
            text-decoration: none;
            transition: color 0.15s;
            border-bottom: 1.5px solid transparent;
            transition: border-color 0.15s;
        }
        nav .links a:hover { border-bottom-color: var(--text); color: var(--text); }
        nav .links a.active { border-bottom-color: var(--text); }
        nav .links a.lang { font-size: 13px; letter-spacing: 0.05em; }

        .page-heading {
            padding: 64px 0 8px;
        }
        .page-heading h1 {
            font-family: 'Noto Serif TC', 'Songti SC', 'SimSun', serif;
            font-size: 40px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.3px;
            margin-bottom: 12px;
        }
        .page-heading p {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .posts { padding: 40px 0 64px; }
        .posts .empty {
            padding: 48px 0;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 400;
        }
        .post-item {
            padding: 24px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .post-item:first-child { border-top: 1px solid rgba(0,0,0,0.1); }
        .post-item .date {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .post-item h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .post-item h2 a {
            color: var(--text);
        }
        .post-item h2 a:hover { color: var(--link); border-bottom: none; }
        .post-item p {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.50;
        }
        .post-item .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .post-item .tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: var(--tag-text);
            background: var(--tag-bg);
            padding: 4px 8px;
            border-radius: 9999px;
            letter-spacing: 0.125px;
        }

        /* Theme toggle pill */
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .theme-toggle:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
        .toggle-track {
            width: 44px;
            height: 22px;
            border-radius: 9999px;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            position: relative;
            display: flex;
            align-items: center;
            transition: inherit;
        }
        .toggle-indicator {
            position: absolute;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text);
            transition: inherit;
        }
        [data-theme='dark'] .toggle-indicator {
            left: calc(100% - 18px);
            background: #fcfcfa;
        }

        footer {
            padding: 32px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .page-heading h1 { font-size: 32px; }
            nav .links { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/zh/" class="logo">王昱揚</a>
            <div class="links">
                <a href="/zh/">首頁</a>
                <a href="/zh/blog/" class="active">網誌</a>
                <a href="/blog/" class="lang">EN</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="toggle-track">
                        <span class="toggle-indicator"></span>
                    </span>
                </button>
            </div>
        </nav>

        <div class="page-heading">
            <h1>網誌</h1>
            <p>關於研究基礎設施、科學人工智慧與策略的筆記。</p>
        </div>

        <div class="posts">
            <div class="empty">
                尚未發表文章。敬請期待。
            </div>
        </div>

        <footer>
            <p>&copy; 2026 王昱揚 &middot; <a href="/zh/">yuyang.nl</a></p>
        </footer>
    </div>
    <script>
        (function() {
            var btn = document.getElementById('theme-toggle');
            var html = document.documentElement;
            function getPreferred() {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            function applyTheme(theme) {
                html.setAttribute('data-theme', theme);
                btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            }
            html.classList.remove('preload');
            var saved = localStorage.getItem('theme');
            if (saved) { applyTheme(saved); }
            else { applyTheme(getPreferred()); }
            btn.addEventListener('click', function() {
                var current = html.getAttribute('data-theme');
                var next = current === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme', next);
                applyTheme(next);
            });
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });
        })();
    </script>
</body>
</html>
