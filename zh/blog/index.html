<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網誌 — 王昱揚</title>
    <meta name="description" content="王昱揚的網誌文章 — 研究基礎設施、科學人工智慧、策略">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text: rgba(0,0,0,0.95);
            --text-secondary: #615d59;
            --text-muted: #a39e98;
            --bg: #ffffff;
            --bg-alt: #f6f5f4;
            --border: rgba(0,0,0,0.1);
            --btn-bg: rgba(0,0,0,0.05);
            --btn-hover: rgba(0,0,0,0.08);
            --tag-bg: #f2f9ff;
            --tag-text: #097fe8;
            --link: #0075de;
            --link-hover: #005bab;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text: rgba(230,225,215,0.95);
                --text-secondary: #a09888;
                --text-muted: #706858;
                --bg: #1a1816;
                --bg-alt: #242220;
                --border: rgba(255,255,255,0.08);
                --btn-bg: rgba(255,255,255,0.08);
                --btn-hover: rgba(255,255,255,0.12);
                --tag-bg: #1e2a3a;
                --tag-text: #7ab8ff;
                --link: #5ba0e0;
                --link-hover: #7ab8ff;
            }
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Inter', 'Noto Serif TC', 'Songti SC', 'SimSun', serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 0 24px; }
        a { color: var(--link); text-decoration: none; }
        a:hover { border-bottom: 1px solid var(--link); }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        nav .logo {
            font-size: 15px;
            font-weight: 600;
            color: rgba(0,0,0,0.95);
            text-decoration: none;
        }
        nav .logo:hover { border-bottom: none; color: #0075de; }
        nav .links { display: flex; gap: 24px; }
        nav .links a {
            font-size: 15px;
            font-weight: 500;
            color: rgba(0,0,0,0.95);
            text-decoration: none;
            padding: 4px 0;
            border-bottom: 1.5px solid transparent;
            transition: border-color 0.15s;
        }
        nav .links a:hover { border-bottom-color: rgba(0,0,0,0.95); color: rgba(0,0,0,0.95); }
        nav .links a.active { border-bottom-color: rgba(0,0,0,0.95); }
        nav .links a.lang { font-size: 13px; letter-spacing: 0.05em; }

        .page-heading {
            padding: 64px 0 8px;
        }
        .page-heading h1 {
            font-size: 40px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }
        .page-heading p {
            font-size: 16px;
            font-weight: 400;
            color: #615d59;
        }

        .posts { padding: 40px 0 64px; }
        .posts .empty {
            padding: 48px 0;
            color: #a39e98;
            font-size: 15px;
            font-weight: 400;
        }
        .post-item {
            padding: 24px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .post-item:first-child { border-top: 1px solid rgba(0,0,0,0.1); }
        .post-item .date {
            font-size: 14px;
            font-weight: 500;
            color: #a39e98;
            margin-bottom: 4px;
        }
        .post-item h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .post-item h2 a {
            color: rgba(0,0,0,0.95);
        }
        .post-item h2 a:hover { color: #0075de; border-bottom: none; }
        .post-item p {
            font-size: 15px;
            font-weight: 400;
color: var(--text-secondary);
            line-height: 1.50;
            max-width: 560px;
        .post-item .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .post-item .tag {
            font-size: 12px;
            font-weight: 600;
color: var(--text-secondary);
            background: var(--bg-alt);
            padding: 6px 14px;
            border-radius: 9999px;
            letter-spacing: 0.125px;
        }

        footer {
            padding: 32px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .page-heading h1 { font-size: 32px; }
            nav .links { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/zh/" class="logo">王昱揚</a>
            <div class="links">
                <a href="/zh/">首頁</a>
                <a href="/zh/blog/" class="active">網誌</a>
                <a href="/" class="lang">EN</a>
            </div>
        </nav>

        <div class="page-heading">
            <h1>網誌</h1>
            <p>關於研究基礎設施、科學人工智慧與策略的筆記。</p>
        </div>

        <div class="posts">
            <div class="empty">
                尚未發表文章。敬請期待。
            </div>
        </div>

        <footer>
            <p>&copy; 2026 王昱揚 &middot; <a href="/zh/">yuyang.nl</a></p>
        </footer>
    </div>
</body>
</html>
