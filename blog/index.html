<!DOCTYPE html>
<html lang="en" class="preload">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Yuyang Wang</title>
    <meta name="description" content="Blog posts by Yuyang Wang on research infrastructure, AI for science, and strategy.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared.css">
    <style>
        .page-heading {
            padding: 64px 0 8px;
        }
        .page-heading h1 {
            font-size: 40px;
            font-weight: 700;
            line-height: 1.10;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
        }
        .page-heading p {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
        }
        .posts { padding: 40px 0 64px; }
        .posts .empty {
            padding: 48px 0;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 400;
        }
        .post-item {
            padding: 24px 0;
            border-bottom: 1px solid var(--border);
        }
        .post-item:first-child { border-top: 1px solid var(--border); }
        .post-item .date {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .post-item h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .post-item h2 a {
            color: var(--text);
        }
        .post-item h2 a:hover { color: var(--link); border-bottom: none; }
        .post-item p {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.50;
        }
        .post-item .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .post-item .tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: var(--tag-text);
            background: var(--tag-bg);
            padding: 4px 8px;
            border-radius: 9999px;
            letter-spacing: 0.125px;
        }
        @media (max-width: 600px) {
            .page-heading h1 { font-size: 32px; letter-spacing: -0.8px; }
            nav .links { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/" class="logo">Yuyang Wang</a>
            <div class="links">
                <a href="/">Home</a>
                <a href="/blog/" class="active">Blog</a>
                <a href="/zh/blog/" class="lang">中文</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="toggle-track">
                        <span class="toggle-indicator"></span>
                    </span>
                </button>
            </div>
        </nav>

        <div class="page-heading">
            <h1>Blog</h1>
            <p>Notes on research infrastructure, AI for science, and strategy.</p>
        </div>

        <div class="posts">
            <div class="empty">
                No posts yet. Coming soon.
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Yuyang Wang &middot; <a href="/">yuyang.nl</a></p>
        </footer>
    </div>
    <script>
        (function() {
            var btn = document.getElementById('theme-toggle');
            var html = document.documentElement;
            function getPreferred() {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            function applyTheme(theme) {
                html.setAttribute('data-theme', theme);
                btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            }
            html.classList.remove('preload');
            var saved = localStorage.getItem('theme');
            if (saved) { applyTheme(saved); }
            else { applyTheme(getPreferred()); }
            btn.addEventListener('click', function() {
                var current = html.getAttribute('data-theme');
                var next = current === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme', next);
                applyTheme(next);
            });
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });
        })();
    </script>
</body>
</html>
