<!DOCTYPE html>
<html lang="en" class="preload">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Yuyang Wang</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared.css">
    <style>
        .not-found {
            padding: 120px 0;
            text-align: center;
        }
        .not-found h1 {
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 72px;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
            margin-bottom: 16px;
        }
        .not-found p {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        .not-found a {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 15px;
            font-weight: 500;
        }
        @media (max-width: 600px) {
            .not-found h1 { font-size: 48px; }
            .not-found { padding: 80px 0; }
        }
    </style>
<script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                var theme = (saved === 'dark' || saved === 'light')
                    ? saved
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
    <div class="container" id="main-content">
        <nav>
            <a href="/" class="logo">Hypomnemata</a>
            <div class="links">
                <a href="/">Home</a>
                <a href="/projects/">Projects</a>
                <a href="/blog/">Blog</a>
                <a href="/zh/" class="lang">中文</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="toggle-track">
                        <span class="toggle-indicator"></span>
                    </span>
                </button>
                <button class="nav-hamburger" aria-label="Menu"><span></span></button>
            </div>
        </nav>

        <div class="not-found">
            <h1>404</h1>
            <p>Page not found. The link may be broken, or the page may have moved.</p>
            <a href="/">Back to home &rarr;</a>
        </div>

        <footer>
            <p>&copy; 2026 Yuyang Wang &middot; Eindhoven, Netherlands</p>
        </footer>
    </div>
<script>
        (function() {
            var btn = document.getElementById('theme-toggle');
            var html = document.documentElement;
            var sysDark = window.matchMedia('(prefers-color-scheme: dark)');

            function updateLabel() {
                var t = html.getAttribute('data-theme');
                btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            }
            function syncBodyTheme(theme) {
                document.body.setAttribute('data-theme', theme || html.getAttribute('data-theme'));
            }

            html.classList.remove('preload');
            syncBodyTheme();
            updateLabel();

            btn.addEventListener('click', function() {
                var cur = html.getAttribute('data-theme');
                var next = cur === 'dark' ? 'light' : 'dark';
                html.classList.add('preload');
                html.setAttribute('data-theme', next);
                syncBodyTheme(next);
                try { localStorage.setItem('theme', next); } catch(e) {}
                updateLabel();
                void html.offsetWidth;
                requestAnimationFrame(function() {
                    html.classList.remove('preload');
                });
            });

            sysDark.addEventListener('change', function(e) {
                try {
                    if (!localStorage.getItem('theme')) {
                        html.classList.add('preload');
                        var nextSys = e.matches ? 'dark' : 'light';
                        html.setAttribute('data-theme', nextSys);
                        syncBodyTheme(nextSys);
                        updateLabel();
                        void html.offsetWidth;
                        requestAnimationFrame(function() {
                            html.classList.remove('preload');
                        });
                    }
                } catch(err) {}
            });
        })();

            (function(){
                var h = document.querySelector('.nav-hamburger');
                var l = document.querySelector('nav .links');
                if (h && l) {
                    h.addEventListener('click', function(){
                        l.classList.toggle('open');
                    });
                }
            })();
</script>
</body>
</html>
